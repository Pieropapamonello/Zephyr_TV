# Checks that every push builds and passes the unit tests. No signing: releases are release.yml's job.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piume-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: ignore
