# Checks that every push builds and passes the unit tests. No signing: releases are release.yml's job.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # Advisory: lint flags issues worth a look (some predate the fork), it doesn't block the build.
      - name: Lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug || { cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piume-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: ignore
