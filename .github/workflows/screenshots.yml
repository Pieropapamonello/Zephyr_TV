# Takes the README screenshots on an Android TV emulator and commits them to docs/screens/ on the branch it runs on.
# Run it by hand from the Actions tab. With the ZEPHYR_TMDB_KEY repository secret (a TMDB API key or read token),
# the screenshots show Spotlight and the TMDB screensaver; without it, the home screen has no Spotlight.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          command -v magick || command -v convert || { sudo apt-get update -q && sudo apt-get install -y -q imagemagick; }

      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TMDB_KEY: ${{ secrets.ZEPHYR_TMDB_KEY }}
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash scripts/screenshots.sh app/build/outputs/apk/debug/app-debug.apk docs/screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screens/
          if-no-files-found: ignore

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screens
          git diff --cached --quiet && { echo "No screenshots"; exit 0; }
          git commit -m "Screenshots from the Android TV emulator"
          git push origin "HEAD:$GITHUB_REF_NAME"
