<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente cornice TV (Tonalità Indaco/Viola per le Serie) -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Sfumature per le schede degli episodi interni -->
    <linearGradient id="cardGradActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardGradInactive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 26)">
    <!-- Antenna / Segnale -->
    <circle cx="256" cy="72" r="8" fill="#818CF8" />
    <line x1="256" y1="80" x2="256" y2="114" stroke="#818CF8" stroke-width="6" stroke-linecap="round" />

    <!-- Cornice TV -->
    <rect x="96" y="114" width="320" height="196" rx="32" fill="#0B0F19" stroke="url(#frameGrad)" stroke-width="20" stroke-linejoin="round" />

    <!-- Contenuto interno: Due schede episodio (Simbolo di Serie TV / Episodi) -->
    <!-- Episodio 1 (Attivo con miniatura e play) -->
    <rect x="126" y="142" width="260" height="64" rx="14" fill="url(#cardGradActive)" stroke="#818CF8" stroke-width="2" />
    <rect x="142" y="154" width="56" height="40" rx="8" fill="#38BDF8" fill-opacity="0.3" />
    <polygon points="166,168 166,182 180,175" fill="#38BDF8" />
    <line x1="210" y1="166" x2="330" y2="166" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="210" y1="184" x2="270" y2="184" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

    <!-- Episodio 2 (In coda / Sfondo) -->
    <rect x="126" y="216" width="260" height="64" rx="14" fill="url(#cardGradInactive)" />
    <rect x="142" y="228" width="56" height="40" rx="8" fill="#64748B" fill-opacity="0.3" />
    <line x1="210" y1="240" x2="310" y2="240" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
    <line x1="210" y1="258" x2="250" y2="258" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <!-- Sezione Testo -->
    <text x="256" y="365" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="36" font-weight="900" fill="#818CF8" text-anchor="middle" letter-spacing="10">SERIES</text>
  </g>
</svg>