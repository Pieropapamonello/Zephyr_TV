<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente cornice TV (Tonalità Oro/Ambra Cinematografica per i Films) -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Sfumatura per il corpo della pellicola -->
    <linearGradient id="filmStripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 26)">
    <!-- Antenna / Segnale -->
    <circle cx="256" cy="72" r="8" fill="#FBBF24" />
    <line x1="256" y1="80" x2="256" y2="114" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" />

    <!-- Cornice TV -->
    <rect x="96" y="114" width="320" height="196" rx="32" fill="#0B0F19" stroke="url(#frameGrad)" stroke-width="20" stroke-linejoin="round" />

    <!-- Contenuto interno: Striscia di pellicola cinematografica (Film Strip) -->
    <rect x="126" y="142" width="260" height="140" rx="14" fill="url(#filmStripGrad)" stroke="#3F3F46" stroke-width="2" />
    
    <!-- Perforazioni superiori della pellicola -->
    <rect x="142" y="152" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="178" y="152" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="214" y="152" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="250" y="152" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="286" y="152" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="322" y="152" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="358" y="152" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />

    <!-- Perforazioni inferiori della pellicola -->
    <rect x="142" y="258" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="178" y="258" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="214" y="258" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="250" y="258" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="286" y="258" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="322" y="258" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />
    <rect x="358" y="258" width="16" height="12" rx="3" fill="#FBBF24" fill-opacity="0.8" />

    <!-- Fotogramma centrale con simbolo Play dorato -->
    <rect x="180" y="178" width="152" height="66" rx="8" fill="#09090B" />
    <polygon points="238,198 238,224 266,211" fill="#FBBF24" />

    <!-- Sezione Testo -->
    <text x="256" y="365" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="36" font-weight="900" fill="#FBBF24" text-anchor="middle" letter-spacing="10">FILMS</text>
  </g>
</svg>