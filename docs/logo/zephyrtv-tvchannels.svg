<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente cornice TV (Tonalità Rosso/Corallo Live) -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <g transform="translate(256, 256) scale(1.42) translate(-256, -230)">
    <!-- Antenna / Segnale -->
    <circle cx="256" cy="72" r="8" fill="#FB7185" />
    <line x1="256" y1="80" x2="256" y2="114" stroke="#FB7185" stroke-width="6" stroke-linecap="round" />

    <!-- Cornice TV -->
    <rect x="96" y="114" width="320" height="196" rx="32" fill="#0B0F19" stroke="url(#frameGrad)" stroke-width="20" stroke-linejoin="round" />

    <!-- Contenuto interno: Badge LIVE e Onde di trasmissione / Equalizzatore -->
    <!-- Badge LIVE -->
    <rect x="126" y="142" width="64" height="28" rx="8" fill="#EF4444" />
    <circle cx="142" cy="156" r="4" fill="#FFFFFF" />
    <text x="174" y="162" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">LIVE</text>

    <!-- Onde radio/segnale in broadcast a destra -->
    <path d="M 320 180 A 30 30 0 0 1 320 240" fill="none" stroke="#FB7185" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M 335 165 A 50 50 0 0 1 335 255" fill="none" stroke="#FB7185" stroke-width="4" stroke-linecap="round" stroke-opacity="0.3" />
    <path d="M 350 150 A 70 70 0 0 1 350 270" fill="none" stroke="#FB7185" stroke-width="4" stroke-linecap="round" stroke-opacity="0.15" />

    <!-- Barre equalizzatore flusso live -->
    <g transform="translate(140, 192)">
      <rect x="0" y="10" width="8" height="40" rx="4" fill="#38BDF8" />
      <rect x="16" y="0" width="8" height="60" rx="4" fill="#FB7185" />
      <rect x="32" y="20" width="8" height="40" rx="4" fill="#38BDF8" />
      <rect x="48" y="-10" width="8" height="70" rx="4" fill="#FBBF24" />
      <rect x="64" y="15" width="8" height="45" rx="4" fill="#FB7185" />
      <rect x="80" y="5" width="8" height="55" rx="4" fill="#38BDF8" />
      <rect x="96" y="25" width="8" height="35" rx="4" fill="#FB7185" opacity="0.6" />
    </g>

    <!-- Sezione Testo -->
    <text x="256" y="365" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="30" font-weight="900" fill="#FB7185" text-anchor="middle" letter-spacing="8">TV CHANNELS</text>
  </g>
</svg>